<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DevArena · 软件单兵作战</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft Yahei',sans-serif;color:#1f2328;background:#f6f8fa}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}header{background:#24292f;color:#f0f6fc;padding:15px 28px;display:flex;align-items:center;gap:28px;flex-wrap:wrap}header strong{font-size:22px}header strong span{color:#7ee787}header nav{display:flex;gap:6px;flex-wrap:wrap}header button{border:0;background:transparent;color:#c9d1d9;padding:9px 13px;border-radius:6px}header button.active,header button:hover{background:#3d444d;color:#fff}.layout{max-width:1350px;margin:auto;display:grid;grid-template-columns:210px 1fr;min-height:calc(100vh - 65px)}aside{border-right:1px solid #d0d7de;padding:24px 12px}aside button{width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:12px;color:#59636e}aside button.active,aside button:hover{background:#eaeef2;color:#1f2328;font-weight:650}aside p{color:#6e7781;font-size:12px;padding:8px;line-height:1.7}main{min-width:0;padding:28px 32px 70px}h1{font-size:26px;margin:0 0 7px}h2{font-size:18px}h3{font-size:15px}.sub{color:#59636e;margin:0 0 22px;line-height:1.6}.panel,.stat{background:white;border:1px solid #d0d7de;border-radius:9px;margin-bottom:17px;overflow:hidden}.pad{padding:20px}.panelhead{padding:14px 19px;background:#f6f8fa;border-bottom:1px solid #d8dee4;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-weight:700}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat{padding:18px}.stat b{display:block;font-size:29px;margin:8px 0}.stat small{color:#59636e}.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:8px 13px;border:1px solid #d0d7de;background:#f6f8fa;color:#24292f;border-radius:6px;font-weight:650}.btn:hover{background:#eaeef2}.btn.green{background:#1f883d;border-color:#1f883d;color:white}.btn.green:hover{background:#1a7f37}.btn.red{color:#cf222e}.btn.blue{background:#0969da;color:white;border-color:#0969da}.btn.small{padding:5px 9px;font-size:12px}input,textarea,select{border:1px solid #d0d7de;background:#fff;border-radius:6px;padding:9px 11px;max-width:100%}input:focus,textarea:focus,select:focus{outline:2px solid #0969da55;border-color:#0969da}textarea{width:100%;resize:vertical;min-height:75px}label.field{display:block;font-weight:650;margin-bottom:15px}label.field input,label.field select,label.field textarea{display:block;width:100%;margin-top:7px;font-weight:400}.hint{font-size:12px;color:#6e7781;margin:7px 0}.pill{display:inline-block;border:1px solid #d0d7de;border-radius:20px;padding:3px 9px;font-size:11px;background:#f6f8fa;color:#59636e}.pill.green{background:#dafbe1;color:#116329;border-color:#a6e3b3}.pill.blue{background:#ddf4ff;color:#0969da;border-color:#b6e3ff}.exam{padding:17px 20px;border-bottom:1px solid #d8dee4;display:flex;gap:15px;align-items:center;justify-content:space-between;flex-wrap:wrap}.exam:last-child{border:0}.exam strong{font-size:15px}.exam small{display:block;color:#6e7781;margin-top:8px}.exam .right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}table{border-collapse:collapse;width:100%}th,td{padding:12px 15px;text-align:left;border-bottom:1px solid #d8dee4}th{font-size:12px;background:#f6f8fa;color:#59636e}tr:last-child td{border:0}.scroll{overflow:auto}.question{border:1px solid #d0d7de;background:#fff;border-radius:9px;margin:15px 0;overflow:hidden}.question .qhead{background:#f6f8fa;border-bottom:1px solid #d0d7de;padding:13px 17px;font-weight:700;display:flex;justify-content:space-between}.question .qbody{padding:18px}.question .prompt{white-space:pre-wrap;line-height:1.8}.option{display:block;border:1px solid #d8dee4;border-radius:6px;padding:11px;margin:7px 0}.option:has(input:checked){background:#dafbe1;border-color:#2da44e}.answer{padding:13px;background:#eafbea;border-left:3px solid #2da44e;white-space:pre-wrap;margin-top:12px}.error,.notice{padding:13px 16px;margin:12px 0;border:1px solid #b6e3ff;background:#ddf4ff;border-radius:6px;line-height:1.7}.error{border-color:#ffcecb;background:#ffebe9;color:#a40e26}.editq{border:1px solid #d0d7de;background:white;border-radius:8px;margin-bottom:14px;padding:17px}.attachment{display:flex;align-items:center;gap:9px;padding:9px;border-bottom:1px solid #eaeef2;flex-wrap:wrap}.attachment:last-child{border:0}.fileimg{display:block;max-width:min(620px,100%);max-height:360px;object-fit:contain;border:1px solid #d0d7de;border-radius:6px;margin:10px 0}.empty{text-align:center;color:#6e7781;padding:28px}.muted{color:#6e7781}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:17px 0}.section{margin-top:22px}.divider{border:0;border-top:1px solid #d8dee4;margin:18px 0}.tag{font-size:12px;background:#ddf4ff;color:#0969da;padding:4px 8px;border-radius:6px}.files{border:1px solid #d8dee4;border-radius:8px;padding:10px;margin:12px 0}.hidden{display:none!important}@media(max-width:900px){.layout{grid-template-columns:1fr}aside{display:flex;overflow:auto;border-right:0;border-bottom:1px solid #d0d7de;padding:8px}aside button{white-space:nowrap;width:auto}aside p{display:none}main{padding:20px 13px}.stats{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}}@media(max-width:500px){.stats{grid-template-columns:1fr 1fr}.stat b{font-size:23px}header{padding:12px}.exam{display:block}.exam .right{margin-top:12px}}
</style></head><body><div id="app"></div><script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nowLocal=(days=0)=>{let d=new Date();d.setDate(d.getDate()+days);let z=v=>String(v).padStart(2,'0');return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}T${z(d.getHours())}:${z(d.getMinutes())}`};
let maxUploadMB=8192,studentFiles=[];
let state={exams:[],submissions:[],files:[]},page='home',admin=false,pwd='',examId='',editing=null,questions=[],lastSubmitted=false,gradingId='',editingDirty=false,oauthMode=false,attemptId='',attemptStarted='',attemptName='',attemptEmployeeId='',loginEmployeeId='';
const exam=id=>state.exams.find(e=>e.id===id);const files=(eid,kind,qid)=>state.files.filter(f=>f.examId===eid&&(!kind||f.kind===kind)&&(!qid||f.questionId===qid));
const maxScore=e=>e.qs.reduce((s,q)=>s+Number(q.score),0);const score=x=>Number(x||0).toLocaleString('zh-CN',{maximumFractionDigits:1});
const status=e=>{let n=new Date();return !e.published?'未发布':n<new Date(e.start)?'未开始':n>new Date(e.end)?'已结束':'进行中'};
const btn=(text,fn,klass='')=>`<button type="button" class="btn ${klass}" onclick="${fn}">${text}</button>`;
function shell(content){let nav=[['home','总览'],['exams','考试中心'],['rank','积分排行榜'],...(admin?[['admin','考试管理'],['grading','阅卷管理']]:[])];$('#app').innerHTML=`<header><strong>⌘ Dev<span>Arena</span></strong><nav>${nav.map(([id,label])=>`<button class="${page===id?'active':''}" onclick="go('${id}')">${label}</button>`).join('')}</nav><div style="margin-left:auto">${oauthMode?btn('退出公司账号',"logout()",'small'):(admin?btn('退出管理',"logout()",'small'):btn('管理员入口',"login()",'small'))}</div></header><div class="layout"><aside>${nav.map(([id,label])=>`<button class="${page===id?'active':''}" onclick="go('${id}')">${({home:'◈',exams:'▤',rank:'♛',admin:'⚙',grading:'✓'})[id]} &nbsp; ${label}</button>`).join('')}<p>软件单兵能力提升<br>考试 · 复盘 · 积分</p></aside><main>${content}<p class="hint" style="text-align:center;margin-top:55px">DevArena · 内部能力提升平台 · JSON 文件存储</p></main></div>`}
async function request(path,body=null,needAdmin=false){let headers={};if(admin||needAdmin)headers['X-Admin-Password']=pwd;let opts={headers};if(body!==null){opts.method='POST';headers['Content-Type']='application/json';opts.body=JSON.stringify(body)}let r=await fetch('/api/'+path,opts);let j=await r.json();if(!r.ok)throw Error(j.error||'请求失败');return j}
async function refresh(){state=await request('state');render()}
async function action(path,data){try{await request(path,data,true);await refresh();return true}catch(e){alert(e.message);return false}}
function go(p){page=p;examId='';attemptId='';lastSubmitted=false;render();scrollTo(0,0)}
async function login(){if(oauthMode){location.href='/auth/login';return;}let p=prompt('请输入管理员密码');if(!p)return;try{let r=await fetch('/api/login',{method:'POST',headers:{'X-Admin-Password':p},body:'{}'});if(!(await r.json()).admin)throw Error('管理员密码错误');pwd=p;admin=true;page='admin';await refresh()}catch(e){alert(e.message)}}
function logout(){if(oauthMode){location.href='/auth/logout';return;}pwd='';admin=false;page='home';refresh()}
function home(){let ex=state.exams,subs=state.submissions;let people=new Set(subs.map(s=>s.employeeId));return `<h1>软件单兵作战能力提升</h1><p class="sub">工程师的技术实战竞技场，持续积累排障经验、复盘资料与成长积分。</p><div class="stats"><div class="stat"><small>已发布考试</small><b>${ex.filter(e=>e.published).length}</b><small>技术训练场次</small></div><div class="stat"><small>累计提交试卷</small><b>${admin?subs.length:'—'}</b><small>由管理员统一评分</small></div><div class="stat"><small>参与工程师</small><b>${admin?people.size:'—'}</b><small>按工号统计</small></div><div class="stat"><small>进行中考试</small><b>${ex.filter(e=>status(e)==='进行中').length}</b><small>现在可参与</small></div></div><div class="panel"><div class="panelhead">最近考试 ${btn('查看全部',"go('exams')",'small')}</div>${examRows([...ex].reverse().slice(0,6))}</div><div class="panel"><div class="panelhead">使用说明</div><div class="pad"><p>参赛同学进入考试后填写<strong>姓名和工号</strong>，完成题目并提交。考试题目可以包括文字、截图和附件。</p><p>管理员发布试题、上传考试和答案文档，在阅卷中心统一评分。答案文档在公开前仅管理员可见。</p></div></div>`}
function examRows(items){return items.length?items.map(e=>`<div class="exam"><div><strong>${esc(e.title)}</strong> <span class="tag">${esc(e.category||'综合')}</span><small>${esc(e.start.replace('T',' '))} ~ ${esc(e.end.replace('T',' '))} · ${e.qs.length} 题 · 满分 ${score(maxScore(e))} · ${e.duration||60} 分钟</small></div><div class="right"><span class="pill ${status(e)==='进行中'?'green':'blue'}">${status(e)}</span>${btn('查看考试',`openExam('${e.id}')`,'small')}</div></div>`).join(''):'<div class="empty">暂无考试，管理员可创建第一场考试。</div>'}
function exams(){return `<h1>考试中心</h1><p class="sub">查看考试安排、下载考试资料、进入在线作答。</p><div class="panel">${examRows([...state.exams].reverse())}</div>`}
function leaderboard(){if(!admin){let arr=state.leaderboard||[];return `<h1>积分排行榜</h1><p class="sub">展示累计积分排行；工号及详细答卷仅管理员可查看。</p><div class="panel scroll"><table><thead><tr><th>排名</th><th>姓名</th><th>累计积分</th><th>完成考试</th></tr></thead><tbody>${arr.map((u,i)=>`<tr><td>${i+1}</td><td>${esc(u.name)}</td><td>${score(u.total)}</td><td>${u.n}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">暂无成绩</td></tr>'}</tbody></table></div>`};let users={};for(let s of state.submissions.filter(s=>s.graded)){let key=s.employeeId;if(!users[key])users[key]={id:key,name:s.name,total:0,n:0};users[key].total+=s.score;users[key].n++}let arr=Object.values(users).sort((a,b)=>b.total-a.total);return `<h1>积分排行榜</h1><p class="sub">已完成阅卷的成绩按照累计积分排序。</p><div class="panel scroll"><table><thead><tr><th>排名</th><th>姓名</th><th>工号</th><th>累计积分</th><th>完成考试</th></tr></thead><tbody>${arr.map((u,i)=>`<tr><td>${i<3?'🏅 ':''}${i+1}</td><td>${esc(u.name)}</td><td>${esc(u.id)}</td><td><strong>${score(u.total)}</strong></td><td>${u.n}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">暂无成绩</td></tr>'}</tbody></table></div>`}
function fileList(eid,kind,qid){let fs=kind==='submission'?state.files.filter(f=>f.kind==='submission'&&f.examId===eid&&f.submissionId===qid):files(eid,kind,qid);return fs.length?`<div class="files">${fs.map(f=>`<div class="attachment"><span>📎 ${esc(f.name)} <small class="muted">(${(f.size/1024).toFixed(1)} KB)</small></span>${btn('下载',`download('${f.id}')`,'small')}${admin?btn('删除',`deleteAttachment('${f.id}')`,'small red'):''}</div>`).join('')}</div>`:''}
function studentFileMarkup(){return studentFiles.length?`<div class="files">${studentFiles.map(f=>`<div class="attachment"><span>📄 ${esc(f.name)} (${(f.size/1024/1024).toFixed(2)} MB)</span>${btn('下载',`download('${f.id}')`,'small')}${btn('删除',`deleteAttachment('${f.id}',true)`,'small red')}</div>`).join('')}</div>`:'<p class="muted">尚未上传答卷文件</p>'}
async function deleteAttachment(id,own=false){if(!confirm('确定永久删除该附件？此操作不可恢复。'))return;try{await request('delete-file',{id,attemptId:own?attemptId:''},true);if(own){studentFiles=studentFiles.filter(f=>f.id!==id);$('#student-file-list').innerHTML=studentFileMarkup()}else await refresh()}catch(e){alert(e.message)}}
async function uploadStudent(){let fList=[...($('#studentUpload').files||[])];if(!attemptId)return alert('请先开始考试');if(!fList.length)return alert('请选择答卷文档');let ok=0;for(let f of fList){if(f.size>maxUploadMB*1024*1024){alert(f.name+' 超过 '+maxUploadMB+' MB');continue}try{let resp=await fetch('/api/student-upload',{method:'POST',headers:{'X-Attempt-Id':attemptId,'X-Exam-Id':examId,'X-File-Name':encodeURIComponent(f.name)},body:f});let result=await resp.json();if(!resp.ok)throw Error(result.error||'上传失败');studentFiles.push(result.file);ok++}catch(e){alert(f.name+' 上传失败：'+e.message)}}$('#student-file-list').innerHTML=studentFileMarkup();$('#studentUpload').value='';if(ok)alert('成功上传 '+ok+' 个附件')}

async function download(id){let name=state.files.find(x=>x.id===id)?.name||studentFiles.find(x=>x.id===id)?.name;try{let h=admin?{'X-Admin-Password':pwd}:{'X-Attempt-Id':attemptId},r=await fetch('/api/files/'+encodeURIComponent(id),{headers:h});if(!r.ok)throw Error('暂无下载权限');let url=URL.createObjectURL(await r.blob()),a=document.createElement('a');a.href=url;a.download=name||'file';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}catch(e){alert(e.message)}}
function openExam(id){studentFiles=[];examId=id;attemptId='';attemptStarted='';attemptName='';attemptEmployeeId='';page='detail';render()}
function detail(){let e=exam(examId);if(!e)return `<div class="error">考试不存在</div>`;let released=e.answersReleased||admin;return `<h1>${esc(e.title)}</h1><p class="sub">${esc(e.desc||'')} · ${esc(e.category||'')}</p><div class="panel"><div class="panelhead">考试信息 <span class="pill ${status(e)==='进行中'?'green':''}">${status(e)}</span></div><div class="pad"><p>时间：${esc(e.start.replace('T',' '))} — ${esc(e.end.replace('T',' '))}</p><p>题量：${e.qs.length} 题 · 满分：${score(maxScore(e))} 分 · 规定时长：${e.duration||60} 分钟</p><h3>考试文档</h3>${fileList(e.id,'exam')||'<p class="muted">暂无考试文档</p>'}<h3>答案文档</h3>${released?(fileList(e.id,'answer')||'<p class="muted">暂无答案文档</p>'):'<p class="muted">答案尚未公开</p>'}<div class="actions">${status(e)==='进行中'&&!admin?btn('进入考场',"page='take';render()",'green'):''}${btn('查看试题',"page='preview';render()")}</div></div></div>`}
function questionDetails(q){let items=[['题目描述',q.description],['场景背景',q.scenario],['任务要求',q.requirements],['提交要求',q.deliverable],['评分标准',q.rubric],['考察知识点',q.knowledge]];return items.filter(x=>String(x[1]||'').trim()).map(([label,value])=>`<div style="margin:13px 0"><b>${label}</b><div class="prompt muted" style="margin-top:5px">${esc(value)}</div></div>`).join('')+(q.difficulty?`<p><span class="pill blue">难度：${esc(q.difficulty)}</span></p>`:'')}
function qContent(e,q,i,mode){let release=admin||e.answersReleased;let att=fileList(e.id,'question',q.id);return `<div class="question"><div class="qhead"><span>第 ${i+1} 题 · ${q.type==='single'?'单选':q.type==='multi'?'多选':'分析简答'}</span><span>${score(q.score)} 分</span></div><div class="qbody"><h3>${esc(q.title)}</h3>${questionDetails(q)}${att}${q.type==='text'?mode==='take'?`<textarea id="answer-${q.id}" placeholder="输入分析思路、定位步骤及结论" rows="6"></textarea>`:'':(q.opts||[]).map((o,j)=>`<label class="option"><input ${mode==='take'?'':'disabled'} type="${q.type==='multi'?'checkbox':'radio'}" name="answer-${q.id}" value="${j}"> ${String.fromCharCode(65+j)}. ${esc(o)}</label>`).join('')}${mode!=='take'&&release?`<div class="answer"><b>参考答案：</b> ${q.type==='text'?esc(q.answer):String(q.answer??'').split(',').map(x=>String.fromCharCode(65+Number(x))).join('、')}<br><b>解析：</b> ${esc(q.explain||'暂无')}</div>`:''}</div></div>`}
function preview(){let e=exam(examId);return `<h1>${esc(e.title)} · 试题预览</h1><p class="sub">${admin||e.answersReleased?'可查看已公开的参考答案':'考试结束后由管理员决定是否公开答案'}</p>${e.qs.map((q,i)=>qContent(e,q,i,'preview')).join('')||'<div class="empty">本次考试仅提供文档，请下载考试文档。</div>'}${btn('返回考试',"page='detail';render()")}`}
function durationText(n){n=Math.max(0,Math.floor(n||0));return `${Math.floor(n/3600)?Math.floor(n/3600)+'小时':''}${Math.floor(n%3600/60)}分${String(n%60).padStart(2,'0')}秒`}
function take(){let e=exam(examId);if(!e||status(e)!=='进行中')return `<div class="error">目前不在可答题时间内。</div>`;
if(!attemptId)return `<h1>${esc(e.title)} · 确认考试身份</h1><p class="sub">点击“开始考试”后服务器开始计时；刷新页面可使用相同姓名与工号恢复计时。</p><div class="panel pad"><div class="split"><label class="field">姓名 *<input id="studentName" maxlength="60" value="${esc(attemptName)}" autocomplete="name" placeholder="姓名"></label><label class="field">工号 *<input id="studentId" maxlength="40" value="${esc(loginEmployeeId||attemptEmployeeId)}" placeholder="工号" ${oauthMode&&loginEmployeeId?'readonly':''}></label></div><p class="hint">考试限时 ${e.duration||60} 分钟，考试统一截止时间 ${esc(e.end.replace('T',' '))}</p>${btn('开始考试并计时',"startExam()",'green')}</div>`;
return `<h1>${esc(e.title)} · 在线答题</h1><p class="sub">${esc(attemptName)}（${esc(attemptEmployeeId)}） · 开始于 ${esc(attemptStarted.replace('T',' '))} · <strong id="elapsedTime">计时中</strong></p><div class="notice">考试时长由服务器记录。关闭或刷新页面不会重置计时，同工号只能提交一次。</div><div class="panel pad">${fileList(e.id,'exam')}</div>${e.qs.map((q,i)=>qContent(e,q,i,'take')).join('')}<div class="panel pad"><h3>上传答卷 / 分析报告</h3><p class="hint">可上传 PDF、Word、Markdown、日志、Core Dump 或 ZIP 等文件，单文件最大 ${maxUploadMB} MB。提交试卷前可删除误传文件；提交后由管理员管理。</p><input id="studentUpload" type="file" multiple><div class="actions">${btn('上传选中文件','uploadStudent()','green')}</div><div id="student-file-list">${studentFileMarkup()}</div></div>${btn('确认提交试卷',"submitExam()",'green')}`}
async function startExam(){let name=$('#studentName').value.trim(),employeeId=$('#studentId').value.trim();if(!name||!employeeId)return alert('请填写姓名和工号');try{let r=await request('start',{examId,name,employeeId});attemptId=r.attemptId;attemptStarted=r.startedAt;attemptName=name;attemptEmployeeId=employeeId;studentFiles=r.files||[];render()}catch(e){alert(e.message)}}
async function submitExam(){let e=exam(examId),name=attemptName,employeeId=attemptEmployeeId;if(!attemptId)return alert('请先开始考试');let answers={};for(let q of e.qs){if(q.type==='text')answers[q.id]=$('#answer-'+q.id).value;else answers[q.id]=[...document.querySelectorAll(`[name="answer-${q.id}"]:checked`)].map(n=>n.value).sort((a,b)=>+a-+b).join(',')}if(!confirm(`确认以「${name} / ${employeeId}」身份提交？提交后不可修改。`))return;try{let r=await request('submit',{examId:e.id,name,employeeId,attemptId,answers});page='submitted';render()}catch(err){alert(err.message)}}
function submitted(){return `<h1>试卷提交成功 ✓</h1><div class="notice">系统已保存姓名、工号及答题记录。管理员阅卷完成后，成绩将纳入积分统计。</div>${btn('返回考试中心',"go('exams')",'green')}`}
function manage(){return `<h1>考试管理</h1><p class="sub">发布考试、设置在线题目、上传考试文档、标准答案及题目截图。</p><div class="actions">${btn('＋ 创建考试',"createExam()",'green')}</div><div class="panel">${state.exams.map(e=>`<div class="exam"><div><strong>${esc(e.title)}</strong><small>${e.qs.length} 题 · ${state.submissions.filter(s=>s.examId===e.id).length} 人提交 · ${status(e)}</small></div><div class="right">${btn('编辑题目',`editExam('${e.id}')`,'small')}${btn('上传附件',`openFiles('${e.id}')`,'small')}${btn(e.published?'取消发布':'发布',`toggle('${e.id}','published',${!e.published})`,'small')}${btn(e.answersReleased?'隐藏答案':'公开答案',`toggle('${e.id}','answersReleased',${!e.answersReleased})`,'small')}${btn('删除',`deleteExam('${e.id}')`,'red small')}</div></div>`).join('')||'<div class="empty">尚未创建考试</div>'}</div>`}
async function toggle(id,key,val){await action('settings',{id,key,value:val})}
async function deleteExam(id){if(confirm('确定删除整场考试？会删除关联成绩、试卷和上传文件，无法恢复。'))await action('delete-exam',{id})}
function createExam(){editing=null;questions=[];page='editor';render()}
function editExam(id){editing=id;questions=structuredClone(exam(id).qs);page='editor';render()}
function editor(){let e=editing?exam(editing):null;let locked=e&&state.submissions.some(s=>s.examId===e.id);return `<h1>${e?'编辑考试':'创建考试'}</h1><p class="sub">先保存考试和题目，再进入“上传附件”绑定考试文档、答案文档及题目截图。</p>${locked?'<div class="notice">该考试已有学生提交，为保证成绩一致性不能修改题目。可以创建新考试。</div>':''}<form id="editor" onsubmit="event.preventDefault();saveExam()"><div class="panel"><div class="panelhead">考试基本信息</div><div class="pad"><label class="field">考试名称 *<input name="title" required value="${esc(e?.title||'')}" placeholder="C++ Core Dump 故障排查演练"></label><label class="field">考试说明<textarea name="desc">${esc(e?.desc||'')}</textarea></label><div class="split"><label class="field">技术方向<input name="category" value="${esc(e?.category||'C++')}"></label><label class="field">答题时长（分钟）<input type="number" min="1" name="duration" value="${e?.duration||60}"></label><label class="field">考试开始时间<input name="start" required type="datetime-local" value="${esc(e?.start||nowLocal())}"></label><label class="field">考试结束时间<input name="end" required type="datetime-local" value="${esc(e?.end||nowLocal(7))}"></label></div><label><input type="checkbox" name="published" ${e?.published?'checked':''}> 保存后直接发布考试</label><br><label><input type="checkbox" name="answersReleased" ${e?.answersReleased?'checked':''}> 向学员公开答案</label></div></div><div class="panel"><div class="panelhead">在线题目 <div class="row">${btn('＋ 单选',"addQ('single')",'small')}${btn('＋ 多选',"addQ('multi')",'small')}${btn('＋ 简答',"addQ('text')",'small')}</div></div><div class="pad" id="qedit"></div></div><div class="actions"><button class="btn green" type="submit">保存考试</button>${btn('返回管理',"go('admin')")}</div></form>`+(setTimeout(drawQuestions,0),'')}
let questionSequence=0;
function newQuestionId(){const bytes=new Uint8Array(16);if(window.crypto&&typeof window.crypto.getRandomValues==='function'){window.crypto.getRandomValues(bytes);return 'q'+Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('')}return 'q'+Date.now().toString(36)+(++questionSequence).toString(36)+Math.random().toString(36).slice(2)}
function addQ(type){syncQuestions();questions.push({id:newQuestionId(),type,title:'',description:'',scenario:'',requirements:'',deliverable:'',rubric:'',knowledge:'',difficulty:'中等',score:10,opts:type==='text'?[]:['选项 A','选项 B'],answer:'',explain:'',attachments:[]});drawQuestions()}
function syncQuestions(){document.querySelectorAll('[data-q]').forEach(n=>{let q=questions[+n.dataset.q],key=n.dataset.key;if(!q)return;q[key]=key==='opts'?n.value.split('\n').filter(x=>x.trim()):n.value})}
function removeQ(i){syncQuestions();questions.splice(i,1);drawQuestions()}
function drawQuestions(){let node=$('#qedit');if(!node)return;node.innerHTML=questions.map((q,i)=>`<div class="editq"><div class="row" style="justify-content:space-between"><b>第 ${i+1} 题 · ${q.type==='single'?'单选':q.type==='multi'?'多选':'简答'}</b>${btn('删除本题',`removeQ(${i})`,'small red')}</div><label class="field">题目标题 *<input data-q="${i}" data-key="title" value="${esc(q.title)}" placeholder="例如：分析 Core Dump 中的线程死锁原因"></label><label class="field">考题描述<textarea data-q="${i}" data-key="description" rows="3" placeholder="简要说明本题要解决的问题、现象或目标">${esc(q.description||'')}</textarea></label><label class="field">场景背景 / 问题现象<textarea data-q="${i}" data-key="scenario" rows="4" placeholder="业务背景、运行环境、日志及复现条件">${esc(q.scenario||'')}</textarea></label><label class="field">具体任务 / 作答要求<textarea data-q="${i}" data-key="requirements" rows="4" placeholder="分析步骤、故障定位、结论及依据">${esc(q.requirements||'')}</textarea></label><label class="field">提交内容 / 格式要求<textarea data-q="${i}" data-key="deliverable" rows="3" placeholder="例如：故障根因、关键证据和修复方案">${esc(q.deliverable||'')}</textarea></label><div class="split"><label class="field">考察知识点<textarea data-q="${i}" data-key="knowledge" rows="2" placeholder="例如：GDB、线程栈、锁竞争">${esc(q.knowledge||'')}</textarea></label><label class="field">难度<select data-q="${i}" data-key="difficulty"><option ${q.difficulty==='简单'?'selected':''}>简单</option><option ${(!q.difficulty||q.difficulty==='中等')?'selected':''}>中等</option><option ${q.difficulty==='困难'?'selected':''}>困难</option></select></label></div><label class="field">评分标准<textarea data-q="${i}" data-key="rubric" rows="4" placeholder="说明各得分点及对应分值">${esc(q.rubric||'')}</textarea></label><div class="split"><label class="field">分值<input data-q="${i}" data-key="score" type="number" min="1" value="${esc(q.score)}"></label><label class="field">${q.type==='text'?'参考答案':'正确选项索引（A=0、B=1；多选 0,2）'}<textarea data-q="${i}" data-key="answer">${esc(q.answer)}</textarea></label></div>${q.type!=='text'?`<label class="field">选项（每行一项）<textarea data-q="${i}" data-key="opts" rows="4">${esc((q.opts||[]).join('\n'))}</textarea></label>`:''}<label class="field">解题解析<textarea data-q="${i}" data-key="explain">${esc(q.explain)}</textarea></label>${editing?`<p class="hint">上传题目截图 / 附件请先保存，再点考试管理中的“上传附件”。</p>${fileList(editing,'question',q.id)}`:''}</div>`).join('')||'<div class="empty">可以不设置在线题目，仅通过考试文档布置任务；但学员需至少一道简答题才能提交分析结果。</div>';node.querySelectorAll('[data-q]').forEach(n=>{n.addEventListener('input',syncQuestions);n.addEventListener('change',syncQuestions)})}
async function saveExam(){syncQuestions();let fd=new FormData($('#editor'));let qs=structuredClone(questions);for(let q of qs){q.score=Number(q.score);if(!q.title.trim()||!Number.isFinite(q.score)||q.score<=0)return alert('请补全题目和分值');if(q.type!=='text'){if(q.opts.length<2)return alert('选择题至少两个选项');let ans=String(q.answer).split(',').map(x=>x.trim());if(ans.some(x=>!/^\d+$/.test(x)||+x>=q.opts.length)||q.type==='single'&&ans.length!==1)return alert('选择题的正确答案格式有误');q.answer=[...new Set(ans)].sort((a,b)=>+a-+b).join(',')}}let obj={id:editing||undefined,title:String(fd.get('title')||''),desc:String(fd.get('desc')||''),category:String(fd.get('category')||''),duration:Number(fd.get('duration')),start:String(fd.get('start')),end:String(fd.get('end')),published:fd.has('published'),answersReleased:fd.has('answersReleased'),qs};try{let r=await request('exam',{exam:obj},true);editing=r.id;await refresh();page='admin';render();alert('考试保存成功，接下来可上传文档和截图')}catch(e){alert(e.message)}}
function openFiles(id){examId=id;page='files';render()}
function fileManager(){let e=exam(examId);if(!e)return '';return `<h1>上传考试文档和题目附件</h1><p class="sub">${esc(e.title)}</p><div class="panel pad"><label class="field">上传类型<select id="kind" onchange="renderFilePicker()"><option value="exam">考试文档</option><option value="answer">答案文档（未公开前管理员可见）</option><option value="question">题目截图 / 相关文件</option></select></label><div id="questionTarget" class="hidden"><label class="field">关联题目<select id="qid">${e.qs.map((q,i)=>`<option value="${q.id}">第 ${i+1} 题 · ${esc(q.title.slice(0,36))}</option>`).join('')}</select></label></div><label class="field">选择文件（支持 PDF、Word、Markdown、PNG、JPG、ZIP、代码文件等）<input id="uploadInput" type="file" multiple></label><p class="hint">单个文件上限 ${maxUploadMB.toLocaleString('zh-CN')} MB；上传的截图以文件形式提供查看和下载，不在网页内执行文件内容。</p>${btn('上传选中文件',"upload()",'green')}</div><div class="panel"><div class="panelhead">已上传附件</div><div class="pad"><h3>考试文档</h3>${fileList(e.id,'exam')||'<p class="muted">暂无</p>'}<h3>答案文档</h3>${fileList(e.id,'answer')||'<p class="muted">暂无</p>'}${e.qs.map((q,i)=>`<h3>第 ${i+1} 题：${esc(q.title.slice(0,60))}</h3>${fileList(e.id,'question',q.id)||'<p class="muted">暂无</p>'}`).join('')}</div></div>${btn('返回管理',"go('admin')")}`}
function renderFilePicker(){$('#questionTarget').classList.toggle('hidden',$('#kind').value!=='question')}
async function upload(){let e=exam(examId),kind=$('#kind').value,qid=kind==='question'?$('#qid').value:'',filelist=[...$('#uploadInput').files];if(!filelist.length)return alert('请选择文件');for(let f of filelist){if(f.size>maxUploadMB*1024*1024){alert(f.name+' 超过 '+maxUploadMB+' MB');continue}try{let r=await fetch('/api/upload',{method:'POST',headers:{'X-Admin-Password':pwd,'X-Exam-Id':e.id,'X-Question-Id':qid,'X-File-Kind':kind,'X-File-Name':encodeURIComponent(f.name)},body:f});let j=await r.json();if(!r.ok)throw Error(j.error)}catch(err){alert(f.name+': '+err.message)}}await refresh();alert('上传处理完成')}
function grading(){let all=[...state.submissions].reverse();return `<h1>阅卷管理</h1><p class="sub">按姓名和工号查看答题情况，客观题自动计分，主观题由管理员评分。</p><div class="panel scroll"><table><thead><tr><th>考试</th><th>姓名</th><th>工号</th><th>提交时间</th><th>考试用时</th><th>成绩</th><th>状态</th><th>操作</th></tr></thead><tbody>${all.map(s=>`<tr><td>${esc(exam(s.examId)?.title||'已删除')}</td><td>${esc(s.name)}</td><td>${esc(s.employeeId)}</td><td>${esc(s.at.replace('T',' ').slice(0,19))}</td><td>${s.durationSeconds===undefined?'历史数据未统计':durationText(s.durationSeconds)}</td><td>${s.graded?score(s.score):'待评分'}</td><td><span class="pill ${s.graded?'green':''}">${s.graded?'已完成':'待阅卷'}</span></td><td>${btn('查看/评分',`openGrade('${s.id}')`,'small')}</td></tr>`).join('')||'<tr><td colspan="8" class="empty">暂无试卷</td></tr>'}</tbody></table></div>`}
function openGrade(id){gradingId=id;page='grade';render()}
function grade(){let s=state.submissions.find(s=>s.id===gradingId);if(!s)return '<div class="error">试卷不存在</div>';let e=exam(s.examId);let manual=e.qs.filter(q=>q.type==='text'),max=manual.reduce((t,q)=>t+Number(q.score),0);return `<h1>批改试卷</h1><p class="sub">${esc(e.title)} · ${esc(s.name)}（${esc(s.employeeId)}） · 考试用时：${s.durationSeconds===undefined?'历史数据未统计':durationText(s.durationSeconds)}</p><div class="stats"><div class="stat"><small>客观题得分</small><b>${score(s.objective)}</b></div><div class="stat"><small>主观题满分</small><b>${score(max)}</b></div><div class="stat"><small>当前总分</small><b>${score(s.score)}</b></div><div class="stat"><small>状态</small><b style="font-size:20px">${s.graded?'已评分':'待阅卷'}</b></div></div><div class="panel pad"><h3>学生提交的文档</h3>${fileList(e.id,'submission',s.id)||'<p class="muted">未提交文件</p>'}</div>${e.qs.map((q,i)=>`<div class="question"><div class="qhead">第 ${i+1} 题 <span>${q.score} 分</span></div><div class="qbody"><h3>${esc(q.title)}</h3>${questionDetails(q)}${fileList(e.id,'question',q.id)}<hr class="divider"><strong>学员作答</strong><p class="prompt">${esc(q.type==='text'?s.answers[q.id]||'未作答':(s.answers[q.id]||'未作答').split(',').map(x=>x==='未作答'?x:String.fromCharCode(65+Number(x))).join('、'))}</p><div class="answer"><b>参考答案：</b> ${esc(q.answer)}<br><b>解析：</b> ${esc(q.explain||'暂无')}</div></div></div>`).join('')}<div class="panel pad"><label class="field">主观题总得分（0 ~ ${score(max)}）<input id="manual" type="number" min="0" max="${max}" step="0.5" value="${s.manual||0}"></label><label class="field">评语<textarea id="feedback" placeholder="可选">${esc(s.feedback||'')}</textarea></label><div class="actions">${btn('保存评分',`saveGrade('${s.id}')`,'green')}${btn('返回阅卷列表',"go('grading')")}</div></div>`}
async function saveGrade(id){let manual=Number($('#manual').value),feedback=$('#feedback').value;if($('#manual').value===''||!Number.isFinite(manual))return alert('请填写有效分数');if(await action('grade',{id,manual,feedback})){page='grading';render()}}
function render(){try{let content=({home,exams,rank:leaderboard,detail,preview,take,submitted,admin:manage,editor,files:fileManager,grading,grade})[page]?.()||home();shell(content)}catch(e){console.error(e);shell(`<div class="error">页面加载失败：${esc(e.message)}</div>`)}}
async function initialize(){try{let uploadCfg=await (await fetch('/api/app-config')).json();maxUploadMB=Number(uploadCfg.max_upload_mb)||8192;let cfg=await (await fetch('/api/auth-config')).json();oauthMode=!!cfg.enabled;if(oauthMode){let r=await fetch('/api/me');if(!r.ok){$('#app').innerHTML='<div style="max-width:560px;margin:12vh auto;background:white;padding:36px;border:1px solid #d0d7de;border-radius:12px"><h1>⌘ DevArena</h1><p>请使用公司 OAuth2 账号登录后访问考试平台。</p><a class="btn green" href="/auth/login">使用公司账号登录</a></div>';return}let me=await r.json();admin=!!me.admin;loginEmployeeId=me.employeeId||''}await refresh()}catch(e){$('#app').innerHTML='<div class="error">无法连接服务：'+esc(e.message)+'</div>'}}
initialize();setInterval(()=>{if(page==='take'&&attemptStarted&&$('#elapsedTime'))$('#elapsedTime').textContent='已用 '+durationText((Date.now()-Date.parse(attemptStarted))/1000);},1000);setInterval(()=>{if(!['take','editor','grade','files'].includes(page))refresh().catch(()=>{})},20000);
</script></body></html>
